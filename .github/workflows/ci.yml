name: ci
on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PG_ADMIN: postgres://postgres:postgres@localhost:5432/postgres

jobs:
  # lint + typecheck + build + เทสต์ความถูกต้องของบัญชี/การแยกข้อมูล/API บน Postgres จริง (ห้าม merge ถ้าไม่ผ่าน)
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm --filter @accounting/api typecheck
      - run: pnpm --filter @accounting/web build   # สร้าง next-env.d.ts ก่อน typecheck
      - run: pnpm --filter @accounting/web typecheck
      - run: pnpm test

  # หน้าจอจริง 3 ขนาด (มือถือ/iPad/คอม): เว็บ + API + ฐานข้อมูลตัวอย่าง แล้วอัปโหลดภาพให้เจ้าของโปรเจกต์ดูก่อน merge
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DEV_DB: postgres://postgres:postgres@localhost:5432/accounting_dev
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # WebKit = เอนจินของ Safari (iPhone/iPad) ทดสอบเพิ่มอีก 2 จอ
      - run: pnpm --filter @accounting/tests exec playwright install --with-deps chromium webkit
      - name: ฐานข้อมูลตัวอย่าง (ครู + นักเรียน + บริษัท)
        run: |
          psql "$PG_ADMIN" -c 'create database accounting_dev'
          DATABASE_URL="$DEV_DB" node scripts/migrate.mjs --seed
          psql "$DEV_DB" -v ON_ERROR_STOP=1 -f db/dev/fixture.sql
          ADMIN_DATABASE_URL="$DEV_DB" pnpm --filter @accounting/api -s set-password teacher@example.test 'ครูบัญชีห้องห้า'
          ADMIN_DATABASE_URL="$DEV_DB" pnpm --filter @accounting/api -s set-password 65012 'ลงบัญชีทุกวัน'
      - run: pnpm --filter @accounting/api build
      - run: pnpm --filter @accounting/web build
      - name: เปิด API และเว็บ
        run: |
          cd apps/api
          # นักเรียนทดสอบคนเดียวรันเทสต์ ~90 ข้อติดกันเร็วกว่าคนจริงมาก (ช่วงพีกเกิน 600 คำขอ/นาที)
          # จึงขยายเพดานต่อผู้ใช้เฉพาะ e2e; ตัวจำกัดเองมีเทสต์ใน tests/auth.test.ts
          DATABASE_URL=postgres://app_dev:app_dev@localhost:5432/accounting_dev COOKIE_SECURE=false REQUESTS_PER_USER_PER_MINUTE=5000 \
            WEB_ORIGIN=http://localhost:3000 NODE_ENV=production nohup node dist/server.js > ../../api.log 2>&1 &
          cd ../web
          API_URL=http://127.0.0.1:4000 nohup pnpm start > ../../web.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/login > /dev/null && curl -sf http://127.0.0.1:4000/health > /dev/null && exit 0; sleep 1; done
          echo "เซิร์ฟเวอร์ไม่ขึ้น"; cat ../../api.log ../../web.log; exit 1
      - run: pnpm --filter @accounting/tests e2e
        env: { E2E_BASE: 'http://localhost:3000', E2E_WEBKIT: '1' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-3-screens
          path: |
            tests/e2e-results/screens
            tests/e2e-results/report
          retention-days: 14
      - if: failure()
        run: tail -n 100 api.log web.log

  # ช่องโหว่ใน dependency และความลับที่หลุดใน repo
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      # ไม่ใช้ cache: job นี้ไม่ได้ pnpm install จึงไม่มี store ให้บันทึก (lockfile เปลี่ยน → cache miss → post step ล้ม)
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pnpm audit --prod --audit-level high
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
