# ค่าของ staging/production self-host (ปรับหน่วยความจำตามเครื่องจริงหลัง k6: PLAN.md ข้อ 13.8)
listen_addresses = '*'
max_connections = 200            # PgBouncer ถือจริงไม่เกิน default_pool_size + LISTEN ของ API
shared_buffers = 512MB
effective_cache_size = 1536MB
work_mem = 8MB
maintenance_work_mem = 128MB
timezone = 'Asia/Bangkok'
log_timezone = 'Asia/Bangkok'
password_encryption = scram-sha-256

# backup ต่อเนื่อง (docs/self-host.md): WAL ทุกไฟล์ถูกเก็บก่อนลบ ส่งเข้า archive อย่างน้อยทุก 5 นาที (RPO)
wal_level = replica
archive_mode = on
archive_command = '/infra/archive-wal.sh %p %f'
archive_timeout = 300
max_wal_senders = 4

# ช่วยหาคำสั่งช้า
log_min_duration_statement = 1000
log_lock_waits = on
log_checkpoints = on
