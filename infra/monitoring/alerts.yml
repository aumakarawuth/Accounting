# เงื่อนไขเตือน (ดูใน Prometheus /alerts หรือ Grafana · ส่งแจ้งเตือนออกผ่าน Uptime Kuma/Grafana contact point: docs/self-host.md)
groups:
  - name: accounting
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 2m
        labels: { severity: critical }
        annotations: { summary: 'บริการ {{ $labels.job }} ไม่ตอบ 2 นาที' }

      - alert: ApiErrorRate
        expr: sum(rate(http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(http_requests_total[5m])), 0.001) > 0.02
        for: 5m
        labels: { severity: critical }
        annotations: { summary: 'API ตอบ 5xx เกิน 2% นาน 5 นาที' }

      - alert: ApiSlow
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[5m]))) > 1
        for: 10m
        labels: { severity: warning }
        annotations: { summary: 'API p95 เกิน 1 วินาทีนาน 10 นาที' }

      - alert: DbPoolWaiting
        expr: max(pg_pool_connections{state="waiting"}) > 5
        for: 5m
        labels: { severity: warning }
        annotations: { summary: 'คำขอรอการเชื่อมต่อฐานข้อมูลใน pool ของ API (เพิ่ม PG_POOL_MAX/default_pool_size หรือหาคำสั่งช้า)' }

      - alert: DbConnectionsHigh
        expr: sum(pg_stat_activity_count) / max(pg_settings_max_connections) > 0.8
        for: 5m
        labels: { severity: warning }
        annotations: { summary: 'การเชื่อมต่อ Postgres เกิน 80% ของ max_connections' }

      - alert: BackupStale
        expr: time() - backup_last_success_timestamp_seconds > 26 * 3600 or absent(backup_last_success_timestamp_seconds)
        for: 15m
        labels: { severity: critical }
        annotations: { summary: 'base backup ไม่สำเร็จมาเกิน 26 ชั่วโมง (docker compose logs backup)' }

      - alert: WalArchiveFailing
        expr: increase(pg_archiver_failed_total[15m]) > 0 and pg_archiver_last_failed_timestamp_seconds > pg_archiver_last_archived_timestamp_seconds
        for: 10m
        labels: { severity: critical }
        annotations: { summary: 'ส่ง WAL เข้า archive ไม่สำเร็จ (กู้ย้อนเวลาไม่ได้ และดิสก์ของ WAL จะโตจนเต็ม: docker compose logs db)' }

      - alert: DiskAlmostFull
        expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"}) < 0.15
        for: 10m
        labels: { severity: critical }
        annotations: { summary: 'ดิสก์ {{ $labels.mountpoint }} เหลือน้อยกว่า 15%' }

      - alert: MemoryLow
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.1
        for: 10m
        labels: { severity: warning }
        annotations: { summary: 'หน่วยความจำของเครื่องเหลือน้อยกว่า 10%' }
