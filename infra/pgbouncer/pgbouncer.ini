; transaction pooling (PLAN.md ข้อ 3.7) API ตั้ง app.user_id ด้วย set_config(..., true) ต่อทรานแซกชันอยู่แล้ว
; LISTEN ของ API ต่อตรงที่ db:5432 (REALTIME_DATABASE_URL) เพราะ transaction pooling ถือการเชื่อมต่อข้ามคำสั่งไม่ได้
[databases]
accounting = host=db port=5432 dbname=accounting

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir =
auth_type = scram-sha-256
auth_file = /tmp/userlist.txt
pool_mode = transaction
max_client_conn = 2000
default_pool_size = 40
reserve_pool_size = 10
max_prepared_statements = 200
server_reset_query =
ignore_startup_parameters = extra_float_digits,options
server_idle_timeout = 300
query_wait_timeout = 30
log_connections = 0
log_disconnections = 0
