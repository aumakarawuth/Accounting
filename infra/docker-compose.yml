# ชุด self-host (docs/self-host.md, สเปก docs/staging-spec.md) รันจากโฟลเดอร์ infra:  docker compose up -d --build
# เปิดสู่ภายนอกเฉพาะ Caddy 80/443 ที่เหลืออยู่ในเครือข่ายภายใน
name: accounting

x-api-env: &api-env
  NODE_ENV: production
  AUTH_ADAPTER: session
  DATABASE_URL: postgres://app_web:${APP_DB_PASSWORD:?ต้องตั้ง APP_DB_PASSWORD}@pgbouncer:6432/accounting
  # LISTEN ต้องต่อตรง ไม่ผ่าน PgBouncer (transaction pooling)
  REALTIME_DATABASE_URL: postgres://app_web:${APP_DB_PASSWORD}@db:5432/accounting
  PG_POOL_MAX: "20"
  COOKIE_SECURE: "true"
  WEB_ORIGIN: https://${SITE_ADDRESS:-localhost}
  # เชื่อ X-Forwarded-For เฉพาะจาก Caddy (IP คงที่ด้านล่าง)
  TRUST_PROXY: 172.29.0.10
  REQUESTS_PER_USER_PER_MINUTE: ${REQUESTS_PER_USER_PER_MINUTE:-600}
  REQUESTS_PER_IP_PER_MINUTE: ${REQUESTS_PER_IP_PER_MINUTE:-60000}
  LOGIN_PER_IP_PER_MINUTE: ${LOGIN_PER_IP_PER_MINUTE:-1200}
  # ตัวชี้วัด Prometheus พอร์ตแยกในเครือข่ายภายใน (Caddy ไม่ส่งต่อ)
  METRICS_PORT: "9464"

services:
  db:
    build: ./db
    image: accounting-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: accounting
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ต้องตั้ง POSTGRES_PASSWORD}
    shm_size: 256mb
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pgrun:/var/run/postgresql
      - backups:/backups
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "accounting"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [internal]

  # migration + ผังบัญชีตั้งต้น + role app_web ทุกครั้งที่ up (ทำซ้ำได้) แล้วจบ
  migrate:
    image: accounting-api        # image เดียวกับ api (build ที่ service api)
    pull_policy: never
    command: ["node", "scripts/bootstrap-db.mjs"]
    environment:
      ADMIN_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/accounting
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      MONITOR_DB_PASSWORD: ${MONITOR_DB_PASSWORD:-}
    depends_on:
      db: { condition: service_healthy }
    networks: [internal]

  pgbouncer:
    image: edoburu/pgbouncer:v1.24.1-p1
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/etc/pgbouncer/entrypoint.sh"]
    environment:
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/entrypoint.sh:/etc/pgbouncer/entrypoint.sh:ro
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [internal]

  api:
    build: { context: .., dockerfile: apps/api/Dockerfile }
    image: accounting-api
    restart: unless-stopped
    environment: *api-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      pgbouncer: { condition: service_started }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [internal]

  web:
    build: { context: .., dockerfile: apps/web/Dockerfile }
    image: accounting-web
    restart: unless-stopped
    environment:
      API_URL: http://api:4000
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/login"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [internal]

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1/32}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web: { condition: service_healthy }
    networks:
      internal:
        ipv4_address: 172.29.0.10

  # base backup + pg_dump ทุกวัน (WAL ถูกเก็บต่อเนื่องโดย db เอง) ต่อฐานผ่านซ็อกเก็ตที่ใช้ร่วมกัน ไม่ต้องใช้รหัส
  backup:
    image: accounting-db
    pull_policy: never
    restart: unless-stopped
    user: postgres
    command: ["/infra/backup-loop.sh"]
    environment:
      POSTGRES_DB: accounting
      BACKUP_AT: ${BACKUP_AT:-02:30}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
    volumes:
      - pgrun:/var/run/postgresql
      - backups:/backups
    depends_on:
      migrate: { condition: service_completed_successfully }
    network_mode: none

  # ส่ง backup ออกนอกเครื่อง: docker compose --profile offsite up -d (remote "offsite" ตั้งด้วย RCLONE_CONFIG_OFFSITE_* ใน .env)
  offsite:
    profiles: [offsite]
    image: rclone/rclone:1.71
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/offsite.sh"]
    env_file: [.env]
    volumes:
      - ./offsite.sh:/offsite.sh:ro
      - backups:/backups:ro
    networks: [egress]

  # ซ้อมกู้คืน: infra/scripts/restore-drill.sh (ไม่แตะฐานจริง ไดรฟ์ backups อ่านอย่างเดียว)
  drill:
    profiles: [drill]
    image: accounting-db
    pull_policy: never
    entrypoint: ["/infra/restore-drill.sh"]
    environment:
      POSTGRES_DB: accounting
      RESTORE_TARGET_TIME: ${RESTORE_TARGET_TIME:-}
    volumes:
      - pgrun:/var/run/postgresql
      - backups:/backups:ro
      - drill:/drill
    network_mode: none

  # ---- monitoring (docker compose --profile monitoring up -d) docs/self-host.md ข้อ 6 ----
  # หน้าจอ Grafana/Uptime Kuma/Prometheus เปิดเฉพาะ 127.0.0.1 ของ server: เข้าผ่าน SSH tunnel ไม่เปิดสู่อินเทอร์เน็ต
  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=30d", "--storage.tsdb.path=/prometheus"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    networks: [internal]

  postgres-exporter:
    profiles: [monitoring]
    image: prometheuscommunity/postgres-exporter:v0.17.1
    restart: unless-stopped
    command: ["--collector.stat_statements", "--collector.long_running_transactions"]
    environment:
      DATA_SOURCE_URI: db:5432/accounting?sslmode=disable
      DATA_SOURCE_USER: monitor
      DATA_SOURCE_PASS: ${MONITOR_DB_PASSWORD:-}   # ไม่ตั้ง = ต่อฐานไม่ได้ (ไม่มี role monitor)
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [internal]

  # เครื่อง (CPU/RAM/ดิสก์) + ไฟล์ตัวชี้วัด backup/WAL ที่ service backup เขียนไว้
  node-exporter:
    profiles: [monitoring]
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    command: ["--path.rootfs=/host", "--collector.textfile.directory=/backups/metrics"]
    pid: host
    volumes:
      - /:/host:ro,rslave
      - backups:/backups:ro
    networks: [internal]

  grafana:
    profiles: [monitoring]
    image: grafana/grafana:12.1.1
    restart: unless-stopped
    # ไม่ตั้งรหัส = ไม่เริ่ม (ค่าเริ่มต้นของ Grafana คือ admin/admin)
    entrypoint: ["/bin/sh", "/grafana-start.sh"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DATE_FORMATS_DEFAULT_TIMEZONE: Asia/Bangkok
    volumes:
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana-start.sh:/grafana-start.sh:ro
      - grafana:/var/lib/grafana
    ports: ["127.0.0.1:3001:3000"]
    networks: [internal]

  # ตรวจจากมุมผู้ใช้ (หน้าเว็บ/API ผ่าน Caddy) + ส่งแจ้งเตือน (LINE/อีเมล/Telegram ตั้งในหน้าเว็บของ Kuma)
  uptime-kuma:
    profiles: [monitoring]
    image: louislam/uptime-kuma:1.23.16
    restart: unless-stopped
    volumes:
      - uptime-kuma:/app/data
    ports: ["127.0.0.1:3002:3001"]
    networks: [internal]

volumes:
  pgdata:
  pgrun:
  backups:
  drill:
  caddy-data:
  caddy-config:
  prometheus:
  grafana:
  uptime-kuma:

networks:
  internal:
    ipam:
      config:
        - subnet: 172.29.0.0/24
          # แจก IP อัตโนมัติเฉพาะ .128-.255: IP คงที่ของ Caddy (.10 ที่ API เชื่อ X-Forwarded-For) จึงไม่ถูกตัวอื่นแย่งไปก่อน
          ip_range: 172.29.0.128/25
  egress: {}
